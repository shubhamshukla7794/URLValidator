<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>URL Inspector | Home</title>
    <th:block th:insert="fragments/layout::head"></th:block>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
<th:block th:insert="fragments/layout::header"></th:block>

    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-xl bg-slate-800/50 backdrop-blur-lg border border-slate-700/50 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-500/10 text-blue-400 rounded-full mb-4">
                    <i class="fas fa-bolt text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-100">Live Website Validator</h2>
                <p class="text-slate-400 text-sm mt-1">Check whether a URL is up, down, or malformed instantly</p>
            </div>

            <form th:object="${urlclass}" th:action="@{/validateURL}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}">
                
                <div>
                    <label for="checkURL" class="block text-sm font-medium text-slate-300 mb-2">Target Website Address</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fas fa-globe-americas"></i>
                        </div>
                        <input id="checkURL" type="text" th:field="*{checkURL}"
                               class="block w-full pl-11 pr-4 py-3.5 bg-slate-950/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-200 placeholder-slate-500 transition text-base"
                               placeholder="example.com"
                               pattern="(https?:\/\/)?([\d\w\.@:%._\+~#=\?&-]+)\.([\w]{2,6})([\/\\w\.@:%._\+~#=\?&-]*)*\/?"
                               th:maxlength="250" required>
                    </div>
                </div>

                <button type="submit" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-blue-500/20 active:scale-[0.98] transition duration-150">
                    <i class="fas fa-paper-plane text-sm"></i> Inspect URL
                </button>
            </form>
        </div>
    </main>

<th:block th:insert="fragments/layout::footer"></th:block>
</body>
</html>
