<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 | Lost In Space</title>
    <th:block th:insert="fragments/layout::head"></th:block>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
<th:block th:insert="fragments/layout::header"></th:block>

    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 items-center gap-12">
            <div class="relative flex items-center justify-center h-72 md:h-96">
                <img src="../static/images/Space_2.png" class="absolute max-h-full object-contain opacity-40 select-none" alt="Space">
                <img src="../static/images/astronaut.png" class="relative max-h-64 object-contain animate-float z-10 filter drop-shadow-[0_10px_20px_rgba(59,130,246,0.3)]" alt="Astronaut">
            </div>
            
            <div class="space-y-6 text-center md:text-left">
                <h1 class="text-7xl md:text-8xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">404</h1>
                <h2 class="text-xl md:text-2xl font-bold text-slate-200 uppercase tracking-wide">Lost in Deep Space</h2>
                <p class="text-slate-400 text-sm md:text-base max-w-sm mx-auto md:mx-0 leading-relaxed" th:text="${exception.getMessage()}">
                    The requested data address configuration does not reside inside our local active database matrices.
                </p>
                <div class="pt-2">
                    <a th:href="@{/}" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/10 transition">
                        <i class="fas fa-home text-sm"></i> Safely Return Home
                    </a>
                </div>
            </div>
        </div>
    </main>

<th:block th:insert="fragments/layout::footer"></th:block>
</body>
</html>
